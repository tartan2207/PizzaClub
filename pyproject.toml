[project]
name = "pizzaclub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django-environ>=0.14.0",
    "django-filter>=26.2",
    "django-stubs>=6.1.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "djangorestframework-stubs>=3.18.1",
    "drf-yasg>=1.21.17",
    "gunicorn>=26.2.0",
    "mypy>=2.4.0",
    "psycopg>=3.3.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "requests>=2.34.2",
    "drf-spectacular>=0.30.0",
    "factory-boy>=3.3.3",
    "pillow>=12.3.0",
]

[project.scripts]
pizzaclub = "pizzaclub:main"



[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9",
    "pytest-django>=4.14",
    "pytest-cov",
    "djangorestframework-simplejwt>=5.5.1",

#    "django-stubs[compatible-mypy]",
#    "djangorestframework-stubs[compatible-mypy]",
    "types-django-filter>=26.1.0.20260906",
    "types-requests>=2.33.0.20260906",
]



[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
pythonpath = ["apps", "tests"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra --ignore=local_docs"


[tool.django-stubs]
django_settings_module = "config.settings.local"
